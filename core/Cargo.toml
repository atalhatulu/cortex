[package]
name = "cortex"
version = "0.1.0-beta.1"
edition = "2021"

[dependencies]
serde_json = "1.0"
clap = { version = "=4.4.18", features = ["derive"] }
divsufsort = "2.0.0"
indicatif = "0.18.6"
rayon = "1.8"
aes-gcm = "0.10.3"
pbkdf2 = "0.12.2"
sha2 = "0.10.8"
rand = "0.8.5"
lz4_flex = "0.14.0"
zstd = "0.13.3"
num_cpus = "1.17.0"
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
lto = true

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "compression_bench"
harness = false
